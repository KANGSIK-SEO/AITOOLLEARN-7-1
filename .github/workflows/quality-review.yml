# 서비스 품질 자동 점검 — 매일 docs/review-checklist.md의 질문마다 Claude(기본 claude-haiku-5-5)가
# 코드·운영 사이트 응답·최근 24시간 운영 요약을 보고 판정한다 (scripts/quality_review.py).
# - 결과는 '[품질 점검] 체크리스트 보고서' 이슈 본문에 표로 갱신한다.
# - 코드로 고칠 수 있는 항목은 '[품질] …' 이슈를 열고 자동 수정(autofix.yml, Claude Fable)을 부른다 → 수정 PR → 주인 승인 → 배포.
#   한 번에 여는 수정 이슈는 QUALITY_MAX_FIXES(기본 3)개까지 — 나머지는 다음 점검 때 이어서 연다 (휴대폰 알림 폭주 방지).
# - 서버 부하로 Vercel 플랜을 올려야 한다고 판정하면 '[용량]' 이슈를 연다 (결제는 사람이 한다).
# 필요: Repository secrets ANTHROPIC_API_KEY (CRON_SECRET이 있으면 운영 요약도 읽는다).
name: quality-review

on:
  schedule:
    - cron: "47 21 * * *"   # 매일 한국 시간 오전 6시 47분
  push:   # 점검 기준이 바뀌면 바로 한 번 돈다
    branches: [main]
    paths: ["docs/review-checklist.md", "scripts/quality_review.py"]
  workflow_dispatch:

permissions:
  issues: write
  actions: write   # 자동 수정(autofix.yml)을 부른다

concurrency:
  group: quality-review
  cancel-in-progress: false

jobs:
  review:
    if: vars.QUALITY_REVIEW_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE_URL: ${{ vars.SITE_URL || 'https://art-chatbot-eight.vercel.app' }}
      MAX_FIXES: ${{ vars.QUALITY_MAX_FIXES || '3' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Review with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          QUALITY_MODEL: ${{ vars.QUALITY_MODEL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY 시크릿이 없어 점검을 건너뜁니다."; exit 0; fi
          pip install -q -r requirements.txt
          python3 scripts/quality_review.py report.md fixes.json capacity.json
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update report issue
        if: hashFiles('report.md') != ''
        run: |
          gh label create quality-report --color 0E8A16 --description "매일 품질 점검 보고서" --force >/dev/null
          gh label create quality --color 1D76DB --description "품질 점검이 찾은 문제" --force >/dev/null
          gh label create guardian --color D93F0B --force >/dev/null
          gh label create capacity --color FBCA04 --description "서버 용량 — Vercel 플랜 확인 (자동 수정 대상 아님)" --force >/dev/null
          { echo "_$(date -u '+%Y-%m-%d %H:%M UTC') 점검 · [실행 기록]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)_"; echo; cat report.md; } > body.md
          num=$(gh issue list --label quality-report --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue edit "$num" --body-file body.md
          else gh issue create --label quality-report --title "[품질 점검] 체크리스트 보고서" --body-file body.md; fi

      - name: Open fix issues and start autofix
        if: hashFiles('fixes.json') != ''
        run: |
          opened=0
          open_titles=$(gh issue list --label quality --state open --limit 200 --json title --jq '.[].title')
          while IFS= read -r item; do
            [ "$opened" -lt "$MAX_FIXES" ] || break
            title=$(jq -r .title <<<"$item")
            if grep -Fxq -- "$title" <<<"$open_titles"; then echo "이미 열린 이슈: $title"; continue; fi
            jq -r .body <<<"$item" > fix-body.md
            url=$(gh issue create --label guardian --label quality --title "$title" --body-file fix-body.md)
            # 이 워크플로가 연 이슈는 다른 워크플로를 깨우지 않아서, 자동 수정은 직접 부른다
            gh workflow run autofix.yml -f issue="${url##*/}" || echo "::warning::자동 수정 워크플로를 부르지 못했습니다: $title"
            opened=$((opened + 1))
          done < <(jq -c '.[]' fixes.json)
          echo "새 수정 이슈 ${opened}개 (한 번에 최대 ${MAX_FIXES}개)"

      - name: Capacity alert
        if: hashFiles('capacity.json') != ''
        run: |
          [ "$(jq -r .status capacity.json)" = "upgrade" ] || exit 0
          open=$(gh issue list --label capacity --state open --json number --jq '.[0].number')
          { echo "품질 점검이 서버 부하 때문에 Vercel 플랜 확인이 필요하다고 판단했습니다."; echo;
            echo "- 근거: $(jq -r .reason capacity.json)"; echo;
            echo "확인할 곳: Vercel → art-chatbot → Usage(함수 실행 시간·동시 실행 한도). 한도에 닿았다면 Pro 이상으로 올리세요."; } > cap.md
          if [ -n "$open" ]; then gh issue comment "$open" --body-file cap.md
          else gh issue create --label capacity --title "[용량] 서버가 버거워요 — Vercel 플랜 확인 필요" --body-file cap.md; fi
