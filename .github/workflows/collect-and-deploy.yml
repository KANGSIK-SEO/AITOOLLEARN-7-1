# 작품 DB 확장 + Vercel 배포.
# 미술관 API는 GitHub 러너에서 접근할 수 있으므로 여기서 수집하고, 결과(data/art.db)를 같은 브랜치에 커밋한다.
# 배포는 저장소 Secrets에 VERCEL_TOKEN이 있을 때만 실행된다 (Settings → Secrets and variables → Actions).
name: collect-and-deploy

on:
  push:
    branches: [claude/trusting-allen-li8f01]
    paths: [".github/workflows/collect-and-deploy.yml", "scripts/collect_*.py"]
  workflow_dispatch:
    inputs:
      skip_collect:
        description: "수집을 건너뛰고 배포만 실행"
        type: boolean
        default: false

concurrency:
  group: collect-and-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    if: ${{ !inputs.skip_collect }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Before
        run: sqlite3 data/art.db "SELECT source, COUNT(*) FROM artworks GROUP BY source"

      - name: Collect AIC (painting, print, drawing, photograph)
        working-directory: scripts
        run: python collect_aic.py

      - name: Commit AIC result
        run: |
          python scripts/finalize_artdb.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/art.db
          git diff --cached --quiet || git commit -m "data: AIC 퍼블릭 도메인 작품 수집 확장"
          git push

      - name: Collect MET (6 departments, time-boxed)
        working-directory: scripts
        continue-on-error: true
        run: python collect_met.py --max-minutes 230

      - name: Test against new DB
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q tests

      - name: Commit MET result
        run: |
          python scripts/finalize_artdb.py
          git add data/art.db
          git diff --cached --quiet || git commit -m "data: MET 퍼블릭 도메인 작품 수집 확장"
          git push

  deploy:
    needs: collect
    if: ${{ always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT || 'art-chatbot' }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 수집 job이 방금 올린 커밋까지 포함
      - name: Deploy to Vercel (production)
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN 시크릿이 없어 배포를 건너뜁니다."
            exit 0
          fi
          npm i -g vercel@latest
          SCOPE_ARG=""
          [ -n "$VERCEL_SCOPE" ] && SCOPE_ARG="--scope $VERCEL_SCOPE"
          vercel link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN" $SCOPE_ARG
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" $SCOPE_ARG
