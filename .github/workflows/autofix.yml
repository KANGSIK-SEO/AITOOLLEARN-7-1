# 가디언 자동 수정 ① — 수정안 만들기.
# 가디언(서버)이나 monitor.yml이 장애·공격 이슈를 열면 Claude가 코드 수정안과 테스트를 쓰고,
# 비밀 값이 없는 곳에서 안전 검사(scripts/autofix_guard.py)와 전체 테스트를 돌린 뒤 통과한 것만 PR로 올린다.
# PR은 저장소 주인에게 리뷰를 요청한다 → GitHub 앱 푸시 알림 → 승인하면 autofix-ship.yml이 배포까지 한다.
#
# 필요: Repository secrets 의 ANTHROPIC_API_KEY. 끄기: Repository variables 에 AUTOFIX_ENABLED=false.
# 실시간: 이슈가 열리면 바로 시작. 같은 문제의 PR이 승인 대기 중이거나 10분 안에 시도했으면 쉰다 (AUTOFIX_SAME_PROBLEM_MINUTES, AUTOFIX_DAILY_MAX로 조정).
name: autofix

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "수정할 가디언 이슈 번호"
        required: true
        type: string

permissions: {}

concurrency:   # 이슈마다 따로 — 여러 문제가 동시에 와도 앞의 것이 취소되지 않는다
  group: autofix-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  ISSUE: ${{ github.event.issue.number || inputs.issue }}

jobs:
  gate:
    if: >-
      vars.AUTOFIX_ENABLED != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.issue.labels.*.name, 'guardian') ||
       contains(github.event.issue.labels.*.name, 'outage'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: write   # 시작하면서 '이 문제를 맡았다'는 기록을 남긴다 (같은 문제의 동시 실행 방지)
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          DAILY_MAX: ${{ vars.AUTOFIX_DAILY_MAX || '0' }}
          SAME_PROBLEM_MINUTES: ${{ vars.AUTOFIX_SAME_PROBLEM_MINUTES || '10' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "::warning::ANTHROPIC_API_KEY 시크릿이 없어 자동 수정을 건너뜁니다."; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          # 실시간: 이슈가 열리면 바로 시작한다. 막는 건 두 가지뿐 —
          #  ① 같은 문제의 수정 PR이 이미 열려 있으면(승인 대기) 또 만들지 않는다 (PR·알림 폭주 방지)
          #  ② 같은 문제를 방금(기본 10분 안에) 시도했으면 쉰다. 하루 상한은 기본 없음(AUTOFIX_DAILY_MAX로 걸 수 있음)
          problem=$(gh issue view "$ISSUE" --json title --jq .title)
          # 같은 문제인지는 제목에서 건수·긴급도·숫자를 뺀 '문제 열쇠'로 본다
          # (예: '… BRUTE_FORCE (6건)'과 '… BRUTE_FORCE (9건)'은 같은 문제 — 숫자가 달라 Fable이 두 번 돌던 낭비를 막는다)
          KEY='def key: gsub("\\s*—\\s*긴급도 \\S+"; "") | gsub("\\s*\\([^()]*[0-9]+건\\)"; "") | gsub("[0-9]+"; "#");'
          pkey=$(jq -rn --arg t "$problem" "$KEY \$t | key")
          day=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          same_since=$(date -u -d "$SAME_PROBLEM_MINUTES minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          open_same=$(gh pr list --label autofix --state open --json title | jq --arg k "$pkey" "$KEY"' [.[] | select((.title | sub("^\\[자동 수정\\] "; "") | key) == $k)] | length')
          if [ "$open_same" -gt 0 ]; then echo "::notice::같은 문제의 수정 PR이 승인을 기다리고 있어 건너뜁니다."; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          lessons=$(gh issue list --label guardian-lessons --state all --json number --jq '.[0].number')
          : > recent.jsonl
          if [ -n "$lessons" ]; then
            gh api "repos/$GH_REPO/issues/$lessons/comments" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and .created_at >= \"$day\") | {at: .created_at, body: .body}" > recent.jsonl
          fi
          attempts=$(jq -s '[.[] | (.body | fromjson? // {}) | select(.outcome and .outcome != "started" and .outcome != "deployed" and .outcome != "rolled_back" and .outcome != "ship_failed" and .outcome != "rejected_at_ship")] | length' recent.jsonl)
          same=$(jq -s --arg k "$pkey" --arg since "$same_since" \
            "$KEY"' [.[] | select(.at >= $since) | (.body | fromjson? // {}) | select(.problem and (.problem | key) == $k)] | length' recent.jsonl)
          # 스스로 배우기: 같은 문제를 24시간 안에 '코드로 고칠 일 아님(no_change)'으로 끝냈으면 다시 Fable을 부르지 않는다
          learned=$(jq -s --arg k "$pkey" \
            "$KEY"' [.[] | (.body | fromjson? // {}) | select(.outcome == "no_change" and .problem and (.problem | key) == $k)] | length' recent.jsonl)
          echo "문제 열쇠: $pkey · 최근 24시간 시도 ${attempts}회 (상한 ${DAILY_MAX}, 0=없음) · 같은 문제 최근 ${SAME_PROBLEM_MINUTES}분 ${same}회 · 24시간 안 '코드 문제 아님' ${learned}회"
          if [ "$same" -gt 0 ]; then echo "::notice::같은 문제를 최근에 이미 시도해 건너뜁니다: $problem"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$learned" -gt 0 ]; then echo "::notice::같은 문제가 24시간 안에 '코드로 고칠 일 아님'으로 끝나 Fable을 다시 부르지 않습니다: $problem"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$DAILY_MAX" -gt 0 ] && [ "$attempts" -ge "$DAILY_MAX" ]; then echo "::notice::오늘 자동 수정 상한(${DAILY_MAX}회)에 도달해 건너뜁니다."; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          # 맡았다는 기록을 바로 남긴다 — 1~2분 뒤 같은 문제로 열린 이슈의 실행은 위 '같은 문제 최근 10분' 검사에서 쉰다
          # (2026-10-09 같은 장애 이슈 3개가 각각 Fable을 돌려 PR이 3개 생긴 일 이후)
          if [ -n "$lessons" ]; then
            jq -nc --arg date "$(date -u +%F)" --arg issue "$ISSUE" --arg problem "$problem" \
              '{date:$date, issue:$issue, problem:$problem, outcome:"started", reason:"수정안 만들기 시작", files:""}' \
              | gh issue comment "$lessons" --body-file - >/dev/null || echo "::warning::시작 기록을 남기지 못했습니다."
          fi
          echo go=true >> "$GITHUB_OUTPUT"

  propose:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false   # 이 단계에는 저장소에 쓸 권한을 남기지 않는다
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -q -r requirements.txt
      - name: Read the issue and past lessons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "$ISSUE" --json title,body > "$RUNNER_TEMP/issue.json"
          lessons=$(gh issue list --label guardian-lessons --state all --json number --jq '.[0].number')
          : > "$RUNNER_TEMP/lessons.txt"
          if [ -n "$lessons" ]; then
            # 워크플로(봇)가 남긴 댓글만 읽는다 — 다른 사람이 쓴 글이 AI에게 들어가지 않게
            gh api "repos/$GH_REPO/issues/$lessons/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > "$RUNNER_TEMP/lessons.txt"
          fi
          python3 -c "import json,sys; rows=[]
          for line in open(sys.argv[1], encoding='utf-8'):
              try: rows.append(json.loads(line))
              except ValueError: pass
          json.dump(rows, open(sys.argv[2], 'w', encoding='utf-8'), ensure_ascii=False)" "$RUNNER_TEMP/lessons.txt" "$RUNNER_TEMP/lessons.json"
      - name: Load learned deny rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 보안 동향 학습(security-intel.yml)이 쌓은 금지 문자열. 봇이 쓴 규칙 이슈만 믿는다 (더할 수만 있는 규칙)
          mkdir -p out
          echo '[]' > out/deny.json
          num=$(gh issue list --label security-intel-rules --state open --json number,author \
            --jq '[.[] | select(.author.login == "app/github-actions" or .author.login == "github-actions")][0].number // empty')
          if [ -n "$num" ]; then
            gh issue view "$num" --json body --jq .body | sed -n '/^```json$/,/^```$/p' | sed '1d;$d' > rules.json || true
            jq -e 'type == "array"' rules.json >/dev/null 2>&1 && cp rules.json out/deny.json || echo "::warning::규칙 이슈를 읽지 못했습니다."
          fi
          echo "배운 금지 문자열 $(jq length out/deny.json)개"
      - name: Ask Claude for a fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOFIX_MODEL: ${{ vars.AUTOFIX_MODEL }}
          AUTOFIX_EFFORT: ${{ vars.AUTOFIX_EFFORT }}
        run: python3 scripts/autofix_propose.py "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/lessons.json" summary.md
      - name: Save the change as a patch
        run: |
          mkdir -p out
          git add -A -- app tests
          git diff --cached --binary main > out/autofix.patch || true
          mv summary.md out/summary.md
          cp "$RUNNER_TEMP/issue.json" out/issue.json
          echo "바뀐 줄: $(grep -c '^[+-]' out/autofix.patch || true)"
      - uses: actions/upload-artifact@v6
        with:
          name: autofix
          path: out/

  verify:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # 비밀 값 없음 — AI가 쓴 코드는 여기서만 실행된다
    outputs:
      empty: ${{ steps.apply.outputs.empty }}
      guard: ${{ steps.guard.outcome }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/download-artifact@v7
        with:
          name: autofix
          path: ${{ runner.temp }}/autofix
      - id: apply
        run: |
          if [ ! -s "$RUNNER_TEMP/autofix/autofix.patch" ]; then echo empty=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git apply --index "$RUNNER_TEMP/autofix/autofix.patch"
          echo empty=false >> "$GITHUB_OUTPUT"
      - id: guard
        if: steps.apply.outputs.empty == 'false'
        continue-on-error: true
        env:
          AUTOFIX_EXTRA_DENY: ${{ runner.temp }}/autofix/deny.json
        run: python3 scripts/autofix_guard.py HEAD | tee "$RUNNER_TEMP/autofix/guard.txt"; exit ${PIPESTATUS[0]}
        shell: bash
      - id: tests
        if: steps.apply.outputs.empty == 'false'
        continue-on-error: true
        shell: bash
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q tests 2>&1 | tail -30 | tee "$RUNNER_TEMP/autofix/tests.txt"; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: autofix-checked
          path: ${{ runner.temp }}/autofix/

  review:
    # 다른 AI가 공격자의 눈으로 변경을 검토한다. AI가 쓴 코드는 실행하지 않고, 테스트 전에 저장한 원본 patch만 읽는다
    needs: [propose, verify]
    if: needs.verify.outputs.empty == 'false' && needs.verify.outputs.guard == 'success' && needs.verify.outputs.tests == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: autofix
          path: ${{ runner.temp }}/pristine
      - name: Security review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
        run: |
          mkdir -p review
          python3 scripts/autofix_review.py "$RUNNER_TEMP/pristine/issue.json" "$RUNNER_TEMP/pristine/autofix.patch" review/review.json
      - uses: actions/upload-artifact@v6
        with:
          name: autofix-review
          path: review/

  report:
    needs: [gate, propose, verify, review]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v7
        if: needs.propose.result == 'success'
        with:
          name: autofix   # 테스트(AI 코드 실행) 전에 저장한 원본 — PR은 이것으로만 만든다
          path: ${{ runner.temp }}/autofix
      - uses: actions/download-artifact@v7
        if: needs.propose.result == 'success'
        continue-on-error: true
        with:
          name: autofix-checked   # 검사·테스트 결과 글(표시용)만 쓴다
          path: ${{ runner.temp }}/checked
      - uses: actions/download-artifact@v7
        if: needs.review.result == 'success'
        with:
          name: autofix-review
          path: ${{ runner.temp }}/review
      - name: Open the PR or record why not
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSE: ${{ needs.propose.result }}
          EMPTY: ${{ needs.verify.outputs.empty }}
          GUARD: ${{ needs.verify.outputs.guard }}
          TESTS: ${{ needs.verify.outputs.tests }}
          REVIEW: ${{ needs.review.result }}
          OWNER: ${{ github.repository_owner }}
        run: |
          D="$RUNNER_TEMP/autofix"; C="$RUNNER_TEMP/checked"; R="$RUNNER_TEMP/review/review.json"
          show() { python3 scripts/autofix_guard.py --visible; }   # AI 글의 숨은 문자·HTML 주석을 보이게 바꾼다
          lesson() {   # 정해진 칸만 JSON 한 줄로 남긴다 → 다음 자동 수정이 참고한다
            num=$(gh issue list --label guardian-lessons --state all --json number --jq '.[0].number')
            if [ -z "$num" ]; then
              gh label create guardian-lessons --color 5319E7 --force >/dev/null
              num=$(gh issue create --label guardian-lessons --title "[가디언] 자동 수정 학습 기록" \
                --body "자동 수정이 끝날 때마다 결과를 한 줄씩 남깁니다. 다음 수정안을 만들 때 AI가 참고합니다." | grep -o '[0-9]*$')
            fi
            jq -nc --arg date "$(date -u +%F)" --arg issue "$ISSUE" --arg outcome "$1" --arg reason "$2" --arg files "$3" \
              --arg problem "$PROBLEM" \
              '{date:$date, issue:$issue, problem:$problem, outcome:$outcome, reason:$reason, files:$files}' | gh issue comment "$num" --body-file -
          }
          PROBLEM=$(gh issue view "$ISSUE" --json title --jq .title)
          if [ "$PROPOSE" != "success" ]; then   # AI 호출 자체가 실패 — 기록해 두면 6시간 동안 다시 시도하지 않는다
            lesson propose_failed "수정안 만들기 실패 (Actions 로그 확인)" ""
            exit 0
          fi
          summary=$( (cat "$D/summary.md" 2>/dev/null || echo "(요약 없음)") | show)
          if [ "$EMPTY" = "true" ]; then
            gh issue comment "$ISSUE" --body "🤖 자동 수정: 코드로 고칠 일이 아니라고 판단했어요.

          $summary"
            lesson no_change "$(echo "$summary" | head -c 280)" ""
            exit 0
          fi
          files=$(grep '^+++ b/' "$D/autofix.patch" | sed 's|^+++ b/||' | tr '\n' ' ')
          if [ "$GUARD" != "success" ] || [ "$TESTS" != "success" ]; then
            why=$([ "$GUARD" != "success" ] && echo "안전 검사 실패: $(grep '^✗' "$C/guard.txt" | head -5 | tr '\n' ' ' | show)" || echo "테스트 실패")
            gh issue comment "$ISSUE" --body "🤖 자동 수정안을 만들었지만 올리지 않았어요 — $why"
            lesson "$([ "$GUARD" != "success" ] && echo rejected_by_guard || echo tests_failed)" "$(echo "$why" | head -c 280)" "$files"
            exit 0
          fi
          # 다른 AI의 보안 검토 — 못 했거나 수상하면 PR을 열지 않는다 (안전한 쪽으로 실패)
          if [ "$REVIEW" != "success" ] || [ ! -s "$R" ]; then
            gh issue comment "$ISSUE" --body "🤖 자동 수정안을 만들었지만 AI 보안 검토를 하지 못해 올리지 않았어요. 10분 뒤 다시 시도할 수 있어요."
            lesson review_failed "보안 검토 실패 (Actions 로그 확인)" "$files"
            exit 0
          fi
          verdict=$(jq -r .verdict "$R")
          review_summary=$(jq -r .summary "$R" | show)
          findings=$(jq -r '.findings[] | "- " + .' "$R" | show)
          if [ "$verdict" != "safe" ]; then
            gh issue comment "$ISSUE" --body "🛑 자동 수정안을 AI 보안 검토에서 막았어요 (해커의 숨은 지시가 섞였을 수 있음). PR을 열지 않았습니다.

          $review_summary
          $findings"
            lesson rejected_by_review "$(echo "$review_summary $findings" | head -c 280)" "$files"
            exit 0
          fi
          branch="autofix/issue-$ISSUE-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git apply --index "$D/autofix.patch"
          git commit -q -m "fix: 가디언 자동 수정안 (이슈 #$ISSUE)"
          git push -q origin "$branch"
          gh label create autofix --color FBCA04 --description "가디언 자동 수정안 — 승인하면 자동 배포" --force >/dev/null
          body="## 🤖 가디언 자동 수정안 (이슈 #$ISSUE)

          $summary

          ## 🔒 보안 점검 (승인 전에 이 칸만이라도 보세요)
          - 기계 검사 (\`scripts/autofix_guard.py\`): **통과** — 보이지 않는 문자·숨은 지시, 비밀 값 노출, 외부 전송·처음 보는 외부 주소,
            보안 검사 제거, 명령 실행·환경변수 읽기, 보호 파일 수정, 보안 동향에서 배운 금지 문자열 없음
          - 다른 AI의 보안 검토: **safe** — $review_summary
          - 바뀐 파일: \`$files\`
          - 이 PR 본문의 AI 글은 숨은 문자·HTML 주석이 보이도록 바꿔 넣었습니다.

          ## 테스트
          \`\`\`
          $(tail -3 "$C/tests.txt" 2>/dev/null | show)
          \`\`\`

          ## 승인하면
          **Approve**를 누르면 main에 합치고 Vercel에 배포한 뒤, 사이트 상태(/healthz)를 확인합니다.
          문제가 생기면 자동으로 되돌리고 다시 배포합니다. 이상하면 승인하지 말고 PR을 닫으세요.

          <!-- autofix-issue: $ISSUE -->"
          gh pr create --base main --head "$branch" --label autofix --reviewer "$OWNER" \
            --title "[자동 수정] $PROBLEM" --body "$body"
          lesson proposed "PR 생성, 승인 대기" "$files"
