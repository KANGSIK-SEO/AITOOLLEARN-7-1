# 가디언 자동 수정 ① — 수정안 만들기.
# 가디언(서버)이나 monitor.yml이 장애·공격 이슈를 열면 Claude가 코드 수정안과 테스트를 쓰고,
# 비밀 값이 없는 곳에서 안전 검사(scripts/autofix_guard.py)와 전체 테스트를 돌린 뒤 통과한 것만 PR로 올린다.
# PR은 저장소 주인에게 리뷰를 요청한다 → GitHub 앱 푸시 알림 → 승인하면 autofix-ship.yml이 배포까지 한다.
#
# 필요: Repository secrets 의 ANTHROPIC_API_KEY. 끄기: Repository variables 에 AUTOFIX_ENABLED=false.
# 실시간: 이슈가 열리면 바로 시작. 같은 문제의 PR이 승인 대기 중이거나 10분 안에 시도했으면 쉰다 (AUTOFIX_SAME_PROBLEM_MINUTES, AUTOFIX_DAILY_MAX로 조정).
name: autofix

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "수정할 가디언 이슈 번호"
        required: true
        type: string

permissions: {}

concurrency:
  group: autofix
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  ISSUE: ${{ github.event.issue.number || inputs.issue }}

jobs:
  gate:
    if: >-
      vars.AUTOFIX_ENABLED != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.issue.labels.*.name, 'guardian') ||
       contains(github.event.issue.labels.*.name, 'outage'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          DAILY_MAX: ${{ vars.AUTOFIX_DAILY_MAX || '0' }}
          SAME_PROBLEM_MINUTES: ${{ vars.AUTOFIX_SAME_PROBLEM_MINUTES || '10' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "::warning::ANTHROPIC_API_KEY 시크릿이 없어 자동 수정을 건너뜁니다."; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          # 실시간: 이슈가 열리면 바로 시작한다. 막는 건 두 가지뿐 —
          #  ① 같은 문제의 수정 PR이 이미 열려 있으면(승인 대기) 또 만들지 않는다 (PR·알림 폭주 방지)
          #  ② 같은 문제를 방금(기본 10분 안에) 시도했으면 쉰다. 하루 상한은 기본 없음(AUTOFIX_DAILY_MAX로 걸 수 있음)
          problem=$(gh issue view "$ISSUE" --json title --jq .title)
          day=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          same_since=$(date -u -d "$SAME_PROBLEM_MINUTES minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          open_same=$(gh pr list --label autofix --state open --json title | jq --arg t "[자동 수정] $problem" '[.[] | select(.title == $t)] | length')
          if [ "$open_same" -gt 0 ]; then echo "::notice::같은 문제의 수정 PR이 승인을 기다리고 있어 건너뜁니다."; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          lessons=$(gh issue list --label guardian-lessons --state all --json number --jq '.[0].number')
          : > recent.jsonl
          if [ -n "$lessons" ]; then
            gh api "repos/$GH_REPO/issues/$lessons/comments" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and .created_at >= \"$day\") | {at: .created_at, body: .body}" > recent.jsonl
          fi
          attempts=$(jq -s '[.[] | (.body | fromjson? // {}) | select(.outcome and .outcome != "deployed" and .outcome != "rolled_back" and .outcome != "ship_failed" and .outcome != "rejected_at_ship")] | length' recent.jsonl)
          same=$(jq -s --arg p "$problem" --arg since "$same_since" \
            '[.[] | select(.at >= $since) | (.body | fromjson? // {}) | select(.problem == $p)] | length' recent.jsonl)
          echo "최근 24시간 시도 ${attempts}회 (상한 ${DAILY_MAX}, 0=없음) · 같은 문제 최근 ${SAME_PROBLEM_MINUTES}분 ${same}회"
          if [ "$same" -gt 0 ]; then echo "::notice::같은 문제를 최근에 이미 시도해 건너뜁니다: $problem"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$DAILY_MAX" -gt 0 ] && [ "$attempts" -ge "$DAILY_MAX" ]; then echo "::notice::오늘 자동 수정 상한(${DAILY_MAX}회)에 도달해 건너뜁니다."; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          echo go=true >> "$GITHUB_OUTPUT"

  propose:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false   # 이 단계에는 저장소에 쓸 권한을 남기지 않는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -q -r requirements.txt
      - name: Read the issue and past lessons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "$ISSUE" --json title,body > "$RUNNER_TEMP/issue.json"
          lessons=$(gh issue list --label guardian-lessons --state all --json number --jq '.[0].number')
          : > "$RUNNER_TEMP/lessons.txt"
          if [ -n "$lessons" ]; then
            # 워크플로(봇)가 남긴 댓글만 읽는다 — 다른 사람이 쓴 글이 AI에게 들어가지 않게
            gh api "repos/$GH_REPO/issues/$lessons/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > "$RUNNER_TEMP/lessons.txt"
          fi
          python3 -c "import json,sys; rows=[]
          for line in open(sys.argv[1], encoding='utf-8'):
              try: rows.append(json.loads(line))
              except ValueError: pass
          json.dump(rows, open(sys.argv[2], 'w', encoding='utf-8'), ensure_ascii=False)" "$RUNNER_TEMP/lessons.txt" "$RUNNER_TEMP/lessons.json"
      - name: Ask Claude for a fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOFIX_MODEL: ${{ vars.AUTOFIX_MODEL }}
          AUTOFIX_EFFORT: ${{ vars.AUTOFIX_EFFORT }}
        run: python3 scripts/autofix_propose.py "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/lessons.json" summary.md
      - name: Save the change as a patch
        run: |
          mkdir -p out
          git add -A -- app tests
          git diff --cached --binary main > out/autofix.patch || true
          mv summary.md out/summary.md
          echo "바뀐 줄: $(grep -c '^[+-]' out/autofix.patch || true)"
      - uses: actions/upload-artifact@v4
        with:
          name: autofix
          path: out/

  verify:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # 비밀 값 없음 — AI가 쓴 코드는 여기서만 실행된다
    outputs:
      empty: ${{ steps.apply.outputs.empty }}
      guard: ${{ steps.guard.outcome }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/download-artifact@v4
        with:
          name: autofix
          path: ${{ runner.temp }}/autofix
      - id: apply
        run: |
          if [ ! -s "$RUNNER_TEMP/autofix/autofix.patch" ]; then echo empty=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git apply --index "$RUNNER_TEMP/autofix/autofix.patch"
          echo empty=false >> "$GITHUB_OUTPUT"
      - id: guard
        if: steps.apply.outputs.empty == 'false'
        continue-on-error: true
        run: python3 scripts/autofix_guard.py HEAD | tee "$RUNNER_TEMP/autofix/guard.txt"; exit ${PIPESTATUS[0]}
        shell: bash
      - id: tests
        if: steps.apply.outputs.empty == 'false'
        continue-on-error: true
        shell: bash
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q tests 2>&1 | tail -30 | tee "$RUNNER_TEMP/autofix/tests.txt"; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autofix-checked
          path: ${{ runner.temp }}/autofix/

  report:
    needs: [gate, propose, verify]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        if: needs.propose.result == 'success'
        with:
          name: autofix-checked
          path: ${{ runner.temp }}/autofix
      - name: Open the PR or record why not
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSE: ${{ needs.propose.result }}
          EMPTY: ${{ needs.verify.outputs.empty }}
          GUARD: ${{ needs.verify.outputs.guard }}
          TESTS: ${{ needs.verify.outputs.tests }}
          OWNER: ${{ github.repository_owner }}
        run: |
          D="$RUNNER_TEMP/autofix"
          lesson() {   # 정해진 칸만 JSON 한 줄로 남긴다 → 다음 자동 수정이 참고한다
            num=$(gh issue list --label guardian-lessons --state all --json number --jq '.[0].number')
            if [ -z "$num" ]; then
              gh label create guardian-lessons --color 5319E7 --force >/dev/null
              num=$(gh issue create --label guardian-lessons --title "[가디언] 자동 수정 학습 기록" \
                --body "자동 수정이 끝날 때마다 결과를 한 줄씩 남깁니다. 다음 수정안을 만들 때 AI가 참고합니다." | grep -o '[0-9]*$')
            fi
            jq -nc --arg date "$(date -u +%F)" --arg issue "$ISSUE" --arg outcome "$1" --arg reason "$2" --arg files "$3" \
              --arg problem "$PROBLEM" \
              '{date:$date, issue:$issue, problem:$problem, outcome:$outcome, reason:$reason, files:$files}' | gh issue comment "$num" --body-file -
          }
          PROBLEM=$(gh issue view "$ISSUE" --json title --jq .title)
          if [ "$PROPOSE" != "success" ]; then   # AI 호출 자체가 실패 — 기록해 두면 6시간 동안 다시 시도하지 않는다
            lesson propose_failed "수정안 만들기 실패 (Actions 로그 확인)" ""
            exit 0
          fi
          summary=$(cat "$D/summary.md" 2>/dev/null || echo "(요약 없음)")
          if [ "$EMPTY" = "true" ]; then
            gh issue comment "$ISSUE" --body "🤖 자동 수정: 코드로 고칠 일이 아니라고 판단했어요.

          $summary"
            lesson no_change "$(echo "$summary" | head -c 280)" ""
            exit 0
          fi
          files=$(grep '^+++ b/' "$D/autofix.patch" | sed 's|^+++ b/||' | tr '\n' ' ')
          if [ "$GUARD" != "success" ] || [ "$TESTS" != "success" ]; then
            why=$([ "$GUARD" != "success" ] && echo "안전 검사 실패: $(grep '^✗' "$D/guard.txt" | head -5 | tr '\n' ' ')" || echo "테스트 실패")
            gh issue comment "$ISSUE" --body "🤖 자동 수정안을 만들었지만 올리지 않았어요 — $why"
            lesson "$([ "$GUARD" != "success" ] && echo rejected_by_guard || echo tests_failed)" "$(echo "$why" | head -c 280)" "$files"
            exit 0
          fi
          branch="autofix/issue-$ISSUE-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git apply --index "$D/autofix.patch"
          git commit -q -m "fix: 가디언 자동 수정안 (이슈 #$ISSUE)"
          git push -q origin "$branch"
          gh label create autofix --color FBCA04 --description "가디언 자동 수정안 — 승인하면 자동 배포" --force >/dev/null
          body="## 🤖 가디언 자동 수정안 (이슈 #$ISSUE)

          $summary

          ## 기계 검사 결과
          - 안전 검사 (\`scripts/autofix_guard.py\`): 통과
          - 전체 테스트: 통과
          \`\`\`
          $(tail -3 "$D/tests.txt")
          \`\`\`

          ## 승인하면
          **Approve**를 누르면 main에 합치고 Vercel에 배포한 뒤, 사이트 상태(/healthz)를 확인합니다.
          문제가 생기면 자동으로 되돌리고 다시 배포합니다. 이상하면 승인하지 말고 PR을 닫으세요.

          <!-- autofix-issue: $ISSUE -->"
          gh pr create --base main --head "$branch" --label autofix --reviewer "$OWNER" \
            --title "[자동 수정] $PROBLEM" --body "$body"
          lesson proposed "PR 생성, 승인 대기" "$files"
