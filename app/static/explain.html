<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 설명 에이전트 / Project Explainer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div class="chat-title">🧑‍💻 프로젝트 설명 에이전트<br><span class="chat-subtitle">이 서비스에 대해 뭐든 물어보세요</span></div>
        </header>

        <section id="chat-panel">
            <div id="chat-log" class="chat-log">
                <div class="message bot">안녕하세요! 이 프로젝트의 코드·설계·문서화 등 뭐든 물어보세요.<br>예) "비밀번호는 어떻게 저장하나요?", "이 함수는 왜 이렇게 짰나요?"</div>
            </div>
            <form id="ask-form" class="input-area">
                <input type="text" id="question-input" maxlength="500" placeholder="질문을 입력하세요" autocomplete="off">
                <button id="send-btn" type="submit" title="보내기">➤</button>
            </form>
        </section>
    </main>
<script src="/static/explain.js"></script>
</body>
</html>
